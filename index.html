<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Throttle</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="header">
        <h1>Throttle</h1>
        <div class="header-actions">
          <button id="refresh-btn" title="Refresh now"><span class="spin-icon">⟳</span></button>
          <button id="settings-btn" title="Settings">⚙</button>
          <button id="close-btn" title="Close">✕</button>
        </div>
      </header>

      <section id="main-view">
        <p id="status-line" class="status-line"></p>

        <section id="active-list" class="provider-list"></section>

        <section class="disabled-section">
          <button id="disabled-toggle" class="disabled-toggle">
            <span id="disabled-caret">▸</span>
            <span class="disabled-toggle-label">Disabled (<span id="disabled-count">0</span>)</span>
          </button>
          <div id="disabled-list" class="provider-list disabled-list" hidden></div>
        </section>
      </section>

      <section id="settings-view" hidden>
        <div id="settings-list" class="settings-list"></div>
        <button id="save-settings-btn" class="save-btn">Save</button>
        <button id="open-config-file-btn" class="link-btn">
          Edit config.json manually
        </button>
      </section>

      <footer class="footer">
        <span id="last-updated"></span>
      </footer>
    </main>
  </body>
</html>
